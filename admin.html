<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — MAISON TABLE</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
  <a class="logo" href="index.html">MAISON TABLE</a>
  <nav>
    <a href="index.html">Store</a>
  </nav>
</header>

<main class="section admin-page">

  <!-- LOGIN -->
  <div id="login-box" class="admin-login-wrap">

    <div class="page-heading">
      <p class="eyebrow">Private Area</p>
      <h1>Admin</h1>
      <p class="page-intro">Manage your products and orders.</p>
    </div>

    <div class="card admin-login">
      <form id="login-form" class="form">

        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="Admin email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Password"
          required
        >

        <button class="btn" type="submit">
          Sign in
        </button>

      </form>
    </div>

  </div>


  <!-- ADMIN CONTENT -->
  <div id="admin-content" style="display:none;">

    <div class="admin-topbar">

      <div>
        <p class="eyebrow">Management</p>
        <h1>Store Dashboard</h1>
      </div>

      <button id="logout-btn" class="btn btn-outline">
        Log out
      </button>

    </div>


    <!-- DASHBOARD -->

    <div class="admin-stats">

      <div class="card admin-stat">
        <span>Products</span>
        <strong id="product-count">0</strong>
      </div>

      <div class="card admin-stat">
        <span>Orders</span>
        <strong id="order-count">0</strong>
      </div>

    </div>


    <!-- PRODUCTS -->

    <section class="admin-section">

      <div class="admin-section-header">

        <div>
          <p class="eyebrow">Catalog</p>
          <h2>Products</h2>
        </div>

        <button id="add-product-btn" class="btn">
          + Add Product
        </button>

      </div>


      <!-- PRODUCT FORM -->

      <div id="product-form-box" class="card admin-product-form" style="display:none;">

        <div class="admin-form-heading">
          <div>
            <p class="eyebrow">Product</p>
            <h3 id="product-form-title">Add Product</h3>
          </div>

          <button id="cancel-product-btn" class="text-button">
            Cancel
          </button>
        </div>


        <form id="product-form" class="form">

          <input type="hidden" id="product-id">


          <label for="product-name">
            Product name
          </label>

          <input
            id="product-name"
            type="text"
            placeholder="Example: Floral Garden Napkin"
            required
          >


          <label for="product-description">
            Description
          </label>

          <textarea
            id="product-description"
            rows="5"
            placeholder="Describe your product..."
          ></textarea>


          <div class="form-row">

            <div>
              <label for="product-price">
                Price (USD)
              </label>

              <input
                id="product-price"
                type="number"
                min="0"
                step="0.01"
                placeholder="8.90"
                required
              >
            </div>


            <div>
              <label for="product-stock">
                Stock
              </label>

              <input
                id="product-stock"
                type="number"
                min="0"
                step="1"
                placeholder="100"
                required
              >
            </div>

          </div>


          <label for="product-image">
            Image URL
          </label>

          <input
            id="product-image"
            type="url"
            placeholder="https://..."
          >


          <label class="checkbox-row">

            <input
              id="product-active"
              type="checkbox"
              checked
            >

            <span>Product is active and visible in the store</span>

          </label>


          <button class="btn" type="submit">
            Save Product
          </button>

          <p id="product-form-message"></p>

        </form>

      </div>


      <!-- PRODUCT LIST -->

      <div id="products-admin"></div>

    </section>


    <!-- ORDERS -->

    <section class="admin-section">

      <div class="admin-section-header">

        <div>
          <p class="eyebrow">Sales</p>
          <h2>Orders</h2>
        </div>

      </div>

      <div id="orders"></div>

    </section>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>

</body>
</html>
